<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supply Chain NLP Chatbot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="fa-solid fa-robot me-2"></i>Supply Chain NLP Chatbot</h4>
                </div>
                <div class="card-body">
                    <form method="post" class="mb-4">
                        {% csrf_token %}
                        <div class="mb-3">
                            {{ form.question.label_tag }}
                            {{ form.question }}
                        </div>
                        <button type="submit" class="btn btn-primary">Ask</button>
                        <a href="/dashboard/" class="btn btn-outline-secondary ms-2">Back to Dashboard</a>
                    </form>
                    {% if answer %}
                        <div class="alert alert-info mt-3">
                            <strong>Bot:</strong> {{ answer|linebreaksbr }}
                        </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
