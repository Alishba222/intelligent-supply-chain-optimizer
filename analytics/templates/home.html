{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligent Supply Chain & Inventory Optimizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
            isolation: isolate;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            background-color: #0f172a;
        }

        .bg-media {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        #bg-video {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            display: block;
            z-index: 0;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.55); /* Clean overlay tint */
            z-index: 1;
        }

        .landing-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            padding: 50px 40px;
            text-align: center;
            max-width: 650px;
            width: 90%;
            z-index: 2;
            color: #ffffff;
        }
        .landing-card h1 {
            font-weight: 800;
            margin-bottom: 20px;
            font-size: 2.5rem;
            letter-spacing: -0.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .landing-card p {
            color: #cbd5e1;
            font-size: 1.15rem;
            margin-bottom: 40px;
            font-weight: 300;
            line-height: 1.6;
        }
        .btn-launch {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            padding: 14px 35px;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 50px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
        }
        .btn-launch:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.6);
            color: white;
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
        }
    </style>
</head>
<body>

    <div class="bg-media" aria-hidden="true">
        <video autoplay muted loop playsinline preload="auto" id="bg-video">
            <source src="{% static 'videos/bg_video.mp4' %}" type="video/mp4">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-abstract-laser-lights-background-23064-large.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
    </div>

    <div class="landing-card">
        <h1>Intelligent Supply Chain & Inventory Optimizer</h1>
        <p>Advanced routing, predictive analytics, and automated clustering for real-time supply chain management.</p>
        
        <a href="{% url 'dashboard' %}" class="btn-launch">
            Access Dashboard <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>

    {% csrf_token %}
    {% include 'chatbot_widget.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</body>
</html>
